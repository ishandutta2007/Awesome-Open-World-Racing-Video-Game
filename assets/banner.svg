<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0a16"/><stop offset="50%" stop-color="#12122b"/><stop offset="100%" stop-color="#1a0b2e"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="pinkGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ff0844"/><stop offset="100%" stop-color="#ffb199"/></linearGradient><linearGradient id="purpleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7f00ff"/><stop offset="100%" stop-color="#e100ff"/></linearGradient></defs><style>@keyframes speedLineFast{0%{stroke-dashoffset:1000;opacity:.2}50%{opacity:.9}}@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes vehicleDash{0%{transform:translateX(-100px)}}.speed-line{stroke-dasharray:200 400;animation:speedLineFast 3s ease-in-out infinite}.ambient-glow{animation:pulseGlow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.car-light{animation:vehicleDash 4s cubic-bezier(.4,0,.2,1) infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g opacity=".25"><line x1="0" x2="1200" y1="260" y2="260" stroke="#00f2fe" stroke-width="2"/><line x1="600" x2="-200" y1="260" y2="400" stroke="#7f00ff" stroke-width="1.5"/><line x1="600" x2="0" y1="260" y2="400" stroke="#7f00ff" stroke-width="1.5"/><line x1="600" x2="200" y1="260" y2="400" stroke="#7f00ff" stroke-width="1.5"/><line x1="600" x2="400" y1="260" y2="400" stroke="#7f00ff" stroke-width="1.5"/><line x1="600" x2="600" y1="260" y2="400" stroke="#7f00ff" stroke-width="2"/><line x1="600" x2="800" y1="260" y2="400" stroke="#7f00ff" stroke-width="1.5"/><line x1="600" x2="1000" y1="260" y2="400" stroke="#7f00ff" stroke-width="1