<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="50%" stop-color="#12122b"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspect */
    @keyframes speedLineFast {
      0% { stroke-dashoffset: 1000; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes vehicleDash {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(1300px); }
    }

    .speed-line {
      stroke-dasharray: 200 400;
      animation: speedLineFast 3s ease-in-out infinite;
    }
    .ambient-glow {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .car-light {
      animation: vehicleDash 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid (Background Layer) -->
  <g opacity="0.25">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#00f2fe" stroke-width="2"/>
    <line x1="600" y1="260" x2="-200" y2="400" stroke="#7f00ff" stroke-width="1.5"/>
    <line x1="600" y1="260" x2="0" y2="400" stroke="#7f00ff" stroke-width="1.5"/>
    <line x1="600" y1="260" x2="200" y2="400" stroke="#7f00ff" stroke-width="1.5"/>
    <line x1="600" y1="260" x2="400" y2="400" stroke="#7f00ff" stroke-width="1.5"/>
    <line x1="600" y1="260" x2="600" y2="400" stroke="#7f00ff" stroke-width="2"/>
    <line x1="600" y1="260" x2="800" y2="400" stroke="#7f00ff" stroke-width="1.5"/>
    <line x1="600" y1="260" x2="1000" y2="400" stroke="#7f00ff" stroke-width="1.5"/>
    <line x1="600" y1="260" x2="1200" y2="400" stroke="#7f00ff" stroke-width="1.5"/>
    <line x1="600" y1="260" x2="1400" y2="400" stroke="#7f00ff" stroke-width="1.5"/>

    <g>
      <line x1="0" y1="270" x2="1200" y2="270" stroke="#00f2fe" stroke-width="1"/>
      <line x1="0" y1="295" x2="1200" y2="295" stroke="#00f2fe" stroke-width="1.2"/>
      <line x1="0" y1="330" x2="1200" y2="330" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="0" y1="375" x2="1200" y2="375" stroke="#00f2fe" stroke-width="2"/>
    </g>
  </g>

  <!-- Ambient Light Orbs (Behind Text) -->
  <circle cx="600" cy="140" r="180" fill="url(#purpleGrad)" opacity="0.3" class="ambient-glow" />
  <circle cx="200" cy="100" r="120" fill="url(#cyanGrad)" opacity="0.2" class="ambient-glow" />
  <circle cx="1000" cy="100" r="120" fill="url(#pinkGrad)" opacity="0.2" class="ambient-glow" />

  <!-- Dynamic Speed Light Streaks (Mid-Background) -->
  <path class="speed-line" d="M -100 80 Q 300 40 1300 70" stroke="url(#cyanGrad)" stroke-width="3" fill="none" />
  <path class="speed-line" d="M -100 310 Q 500 330 1300 300" stroke="url(#pinkGrad)" stroke-width="4" fill="none" style="animation-delay: -1.5s;"/>

  <!-- Fast Passing Light Streak representing Speeding Car -->
  <g class="car-light">
    <ellipse cx="0" cy="325" rx="60" ry="4" fill="url(#pinkGrad)"/>
    <ellipse cx="-20" cy="325" rx="120" ry="2" fill="#ffffff"/>
  </g>

  <!-- Foreground Container / Card Overlay to ensure 100% Crisp Legibility -->
  <rect x="80" y="45" width="1040" height="250" rx="16" fill="#0d0e21" fill-opacity="0.85" stroke="url(#cyanGrad)" stroke-width="1.5" />

  <!-- Foreground Title and Subtitles -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="440" y="70" width="320" height="32" rx="16" fill="url(#pinkGrad)" opacity="0.95" />
    <text x="600" y="91" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="2.5">
      AWESOME CURATED ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="160" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="1">
      Open-World Racing Video Games
    </text>

    <!-- Subtitle -->
    <text x="600" y="205" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#b3c5e6" letter-spacing="0.5">
      Top Commercial AAA Titles • Open-Source Driving Engines • Vehicle Simulation Sandboxes
    </text>

    <!-- Feature Pills in Banner Foreground -->
    <g transform="translate(310, 238)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="28" rx="14" fill="#181a3a" stroke="#00f2fe" stroke-width="1"/>
      <text x="85" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#00f2fe">10+ AAA SaaS Racers</text>
      
      <!-- Pill 2 -->
      <rect x="190" y="0" width="200" height="28" rx="14" fill="#181a3a" stroke="#ff0844" stroke-width="1"/>
      <text x="290" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ff758c">15+ Open-Source Engines</text>
      
      <!-- Pill 3 -->
      <rect x="410" y="0" width="170" height="28" rx="14" fill="#181a3a" stroke="#e100ff" stroke-width="1"/>
      <text x="495" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e100ff">Market &amp; Star Metrics</text>
    </g>
  </g>
</svg>
